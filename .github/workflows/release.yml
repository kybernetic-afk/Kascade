name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.20.0

      - name: Generate version info
        env:
          KASCADE_VERSION: ${{ github.ref_name }}
        run: python scripts/make_version_file.py

      - name: Build executable
        run: >
          pyinstaller --noconfirm --onefile --windowed --name Kascade
          --icon assets/icon.ico
          --add-data "assets/icon.ico;assets"
          --version-file version_info.txt
          run_app.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^[vV]', ''
          if ($v -notmatch '^\d+\.\d+\.\d+') {
            $v = (python -c "import kascade; print(kascade.__version__)").Trim()
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$v installer.iss

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kascade
          path: |
            dist/Kascade.exe
            dist/Kascade-Setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Kascade.exe
            dist/Kascade-Setup.exe
